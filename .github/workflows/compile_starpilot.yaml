name: Compile StarPilot

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel compiler jobs (1-4)"
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'

concurrency:
  group: compile-starpilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build_device.yaml
    with:
      source: ${{ github.sha }}
      jobs: ${{ inputs.jobs || '4' }}

  publish:
    needs: build
    if: >-
      github.repository == 'techfoundrynz/StarPilot' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish_device.yaml
    with:
      source: ${{ needs.build.outputs.source }}
      artifact_run: ${{ github.run_id }}
