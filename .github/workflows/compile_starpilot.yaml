name: Compile StarPilot

on:
  push:
    branches: [StarPilot, Dom]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel compiler jobs (1-4)"
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'

concurrency:
  group: compile-starpilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    name: AGNOS device binaries (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      BUILD_JOBS: ${{ inputs.jobs || '4' }}
      COMMA_BUILD_IMAGE: starpilot-larch64-builder:ci
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record source revision
        run: |
          mkdir -p .ci-output
          git rev-parse HEAD | tee .ci-output/source-commit.txt
          df -h .

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/laptop_device_build/Dockerfile
          platforms: linux/arm64
          load: true
          tags: starpilot-larch64-builder:ci
          cache-from: type=gha,scope=device-toolchain-arm64
          cache-to: type=gha,mode=max,scope=device-toolchain-arm64

      - name: Restore AGNOS sysroot
        id: sysroot
        uses: actions/cache@v5
        with:
          path: .comma_sysroot
          key: agnos-sysroot-arm64-${{ hashFiles('system/hardware/tici/agnos.json', 'tools/laptop_device_build/extract_sysroot_from_agnos.py', 'tools/laptop_device_build/Dockerfile') }}

      - name: Extract AGNOS sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/laptop_device_build.sh setup-sysroot-agnos 2>&1 | tee .ci-output/sysroot.log
          # The extracted sysroot is cached; discard the multi-GB source images.
          rm -rf -- .cache/agnos

      - name: Build comma device binaries
        run: |
          set -o pipefail
          bash build "$BUILD_JOBS" 2>&1 | tee .ci-output/build.log

      - name: Verify and package device build
        run: python3 tools/ci/package_device_build.py --output .ci-output

      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: starpilot-device-${{ github.sha }}
          path: |
            .ci-output/starpilot-device.tar.gz
            .ci-output/SHA256SUMS
            .ci-output/source-commit.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starpilot-device-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .ci-output/*.log
            .ci-output/source-commit.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish binaries to install branch
    needs: device
    if: >-
      github.repository == 'techfoundrynz/StarPilot' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/StarPilot' || github.ref == 'refs/heads/Dom')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download verified device build
        uses: actions/download-artifact@v4
        with:
          name: starpilot-device-${{ github.sha }}
          path: ${{ runner.temp }}/device-artifact

      - name: Publish matching binaries
        env:
          SOURCE_SHA: ${{ github.sha }}
          INSTALL_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote --exit-code origin "refs/heads/$INSTALL_BRANCH" | cut -f1)
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "Newer source is already on $INSTALL_BRANCH; skipping this older build."
            exit 0
          fi
          python3 tools/ci/apply_device_build.py \
            --artifact "$RUNNER_TEMP/device-artifact" \
            --source "$SOURCE_SHA" --paths "$RUNNER_TEMP/device-paths"
          git add -f --pathspec-from-file="$RUNNER_TEMP/device-paths" --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "Install branch already contains these binaries."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish device binaries for $SOURCE_SHA [skip ci]"
          if ! git push origin "HEAD:refs/heads/$INSTALL_BRANCH"; then
            latest=$(git ls-remote --exit-code origin "refs/heads/$INSTALL_BRANCH" | cut -f1)
            if [ "$latest" != "$SOURCE_SHA" ]; then
              echo "Branch advanced during publication; leaving the newer source intact."
              exit 0
            fi
            exit 1
          fi
