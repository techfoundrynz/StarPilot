name: Build device binaries

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      jobs:
        type: string
        default: '4'
    outputs:
      source:
        value: ${{ jobs.device.outputs.source }}

permissions:
  contents: read

jobs:
  device:
    name: AGNOS device binaries (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    outputs:
      source: ${{ steps.source.outputs.sha }}
    env:
      BUILD_JOBS: ${{ inputs.jobs || '4' }}
      COMMA_BUILD_IMAGE: starpilot-larch64-builder:ci
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source }}
          submodules: recursive
          persist-credentials: false

      - name: Record source revision
        id: source
        run: |
          mkdir -p .ci-output
          git rev-parse HEAD | tee .ci-output/source-commit.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          df -h .

      - name: Test CI publication and update handling
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q -c /dev/null --confcutdir=tools/ci tools/ci

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/laptop_device_build/Dockerfile
          platforms: linux/arm64
          load: true
          tags: starpilot-larch64-builder:ci
          cache-from: type=gha,scope=device-toolchain-arm64
          cache-to: type=gha,mode=max,scope=device-toolchain-arm64

      - name: Restore AGNOS sysroot
        id: sysroot
        uses: actions/cache@v5
        with:
          path: .comma_sysroot
          key: agnos-sysroot-arm64-${{ hashFiles('system/hardware/tici/agnos.json', 'tools/laptop_device_build/extract_sysroot_from_agnos.py', 'tools/laptop_device_build/Dockerfile') }}

      - name: Extract AGNOS sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/laptop_device_build.sh setup-sysroot-agnos 2>&1 | tee .ci-output/sysroot.log
          # The extracted sysroot is cached; discard the multi-GB source images.
          rm -rf -- .cache/agnos

      - name: Verify AGNOS pet image decoding
        env:
          PYTHONPATH: ${{ github.workspace }}/.comma_sysroot/usr/local/venv/lib/python3.12/site-packages
        run: |
          python3 - <<'PY'
          import io
          from pathlib import Path
          import PIL
          from PIL import Image, features
          assert Path(PIL.__file__).resolve().is_relative_to(Path('.comma_sysroot').resolve())
          assert features.check('webp'), 'AGNOS runtime lacks WebP support'
          data = io.BytesIO()
          Image.new('RGBA', (192, 208), (10, 20, 30, 128)).save(data, format='WEBP', lossless=True)
          data.seek(0)
          with Image.open(data) as image:
            image.load()
            assert image.size == (192, 208) and image.getpixel((0, 0)) == (10, 20, 30, 128)
          print(f'AGNOS Pillow {PIL.__version__}: transparent WebP round-trip passed')
          PY

      - name: Build comma device binaries
        run: |
          set -o pipefail
          bash build "$BUILD_JOBS" 2>&1 | tee .ci-output/build.log

      - name: Verify and package device build
        run: python3 tools/ci/package_device_build.py --output .ci-output

      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: starpilot-device-${{ steps.source.outputs.sha }}
          path: |
            .ci-output/starpilot-device.tar.gz
            .ci-output/SHA256SUMS
            .ci-output/source-commit.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starpilot-device-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .ci-output/*.log
            .ci-output/source-commit.txt
          if-no-files-found: warn
          retention-days: 14
